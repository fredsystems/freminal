[package]
name = "freminal-windowing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windowing layer for Freminal: winit + glutin + egui integration"
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
conv2.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_glow.workspace = true
glow.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true

[features]
default = []
# Frame-profiling instrumentation (Task 121): adds `Instant`-based phase
# timers and counters to `EguiState::run_frame` (chrome-mode duty cycle,
# per-phase wall-clock breakdown for run_ui/tessellate/paint/swap), flushed
# as its own `tracing::debug!` line every `FrameProfile::FLUSH_EVERY` drawn
# frames per window. NOT enabled by default -- see the identical rationale
# on the `freminal` crate's `frame-profiling` feature, which enables this one.
frame-profiling = []

[[example]]
name = "hello"
path = "examples/hello.rs"
