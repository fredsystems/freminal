[package]
name = "freminal-windowing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Windowing layer for Freminal: winit + glutin + egui integration"
documentation.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
conv2.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_glow.workspace = true
glow.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
raw-window-handle.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true

[features]
default = []
# Frame-profiling instrumentation (Task 121): adds `Instant`-based phase
# timers and counters to `EguiState::run_frame` (chrome-mode duty cycle,
# per-phase wall-clock breakdown for run_ui/tessellate/paint/swap), flushed
# as its own `tracing::debug!` line every `FrameProfile::FLUSH_EVERY` drawn
# frames per window. NOT enabled by default -- see the identical rationale
# on the `freminal` crate's `frame-profiling` feature, which enables this one.
frame-profiling = []
# Offscreen pbuffer GL context for the Task 123 Phase 2 pixel/readback
# harness. NOT enabled by default -- it is test infrastructure, needs Mesa
# and an X server present, and has no place in a production build. Also
# `target_os = "linux"`-gated at the module, so enabling it elsewhere is a
# no-op rather than a compile error.
gl-offscreen = []
# Asynchronous GPU timestamp-query foundation (Task 125.7): a bounded
# `GpuQueryRing<Q>` lifecycle state machine plus pure capability detection
# (desktop OpenGL 3.3+ or `GL_ARB_timer_query`; GLES/unsupported report
# `Unavailable`). NOT enabled by default -- it is measurement infrastructure
# with no default-build presence, mirroring `frame-profiling`'s rationale.
# The state machine itself never touches a concrete GL context (driven
# entirely through the `GpuQuerySource` trait), so this feature adds no new
# dependency and no unsafe code.
gpu-profiling = []

[[example]]
name = "hello"
path = "examples/hello.rs"
