[workspace]
resolver = "3"
members = ["freminal", "freminal-buffer", "freminal-common", "freminal-terminal-emulator", "freminal-windowing", "portable-pty", "xtask"]
default-members = ["freminal", "freminal-buffer", "freminal-common", "freminal-terminal-emulator"]
# `fuzz/` is a standalone cargo-fuzz crate (nightly + sanitizers, its own
# `[workspace]` and `Cargo.lock`); keep it out of this workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.13.0-beta.1"
edition = "2024"
rust-version = "1.96.0"
description = "A terminal emulator written in Rust"
documentation = "https://github.com/fredsystems/freminal/README.md"
readme = "README.md"
repository = "https://github.com/fredsystems/freminal"
license = "MIT"
keywords = ["emulator", "terminal", "terminal-emulator", "tty", "vt100"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
arc-swap = "1.9.2"
assert_cmd = "2.2.2"
bitflags = "2.13.2"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap-cargo = { version = "0.19.0", features = ["cargo_metadata"] }
clap-verbosity-flag = "3.0.4"
color-eyre = "0.6.5"
conv2 = "0.4.2"
criterion = "0.8.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
downcast-rs = "2.0.2"
duct = "1.1.2"
# Exact-pinned (`=`) as a matched set: #436 relies on egui_glow's
# (undocumented) tolerance of multiple `paint_primitives` calls per frame for
# the chrome-cache head/band/tail split, so even a patch bump must be a
# deliberate, re-verified change against every assumption in
# `Documents/EGUI_UPGRADE_ASSUMPTIONS.md`. egui / egui_glow / egui-winit must
# move in lockstep, so all three are exact-pinned together.
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts", "persistence"] }
egui_glow = { version = "=0.36.2", default-features = false }
# egui-winit's default features are disabled only to stop it re-enabling
# `winit/default` (which pulls `wayland-csd-adwaita` -> ab_glyph -> ttf-parser,
# #530); the list below is its default set minus `winit/default`. The version
# pin is unchanged and the `EGUI_UPGRADE_ASSUMPTIONS.md` checklist still
# governs any bump.
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard", "links", "wayland", "x11"] }
filedescriptor = "0.8.3"
flate2 = "1.1.10"
fontdb = "0.24.0"
futures = "0.3.34"
# Held at 0.17 deliberately: `egui_glow` 0.36.2 declares `glow = "0.17.0"`, and
# upstream cannot move to 0.18 because wgpu 30's `wgpu-hal` pins glow 0.17 (a
# bump would split glow into two versions in egui's own graph). We hand
# `Arc<glow::Context>` straight to `egui_glow::Painter`, so a mismatch here is
# not merely a duplicate dependency -- it is a type error across two copies of
# the crate. Bump only once `egui_glow`'s own declared glow requirement moves.
# `renovate.json` constrains glow to `<0.18` so the egui group stops proposing
# an update that cannot resolve.
glow = "0.17.0"
glutin = "0.32.3"
glutin-winit = "0.5.0"
harfrust = "0.12.0"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lazy_static = "1.5.1"
libc = "0.2.190"
log = "0.4.34"
lz4_flex = "0.14.0"
nix = "0.31.3"
# `images_no_default_features` enables the inline `image-data` D-Bus hint
# (`Notification::image_data` / `Image::from_rgba`) so freminal can attach its
# app icon to desktop notifications as raw bytes -- working even when freminal
# is not installed into the system icon theme (dev / cargo-run / AppImage),
# the way Discord & co. do. `z` is notify-rust's default feature (the zbus
# backend + serde); it is listed only for documentation -- this entry does
# NOT set `default-features = false`, so the default set is retained
# regardless. We decode the PNG ourselves via the workspace `image` crate, so
# notify-rust's heavier `images` feature (its own codecs + rayon) is
# deliberately NOT used.
notify-rust = { version = "4.18.1", features = ["images_no_default_features", "z"] }
open = "5.4.4"
predicates = "3.1.4"
proptest = "1.11.0"
raw-window-handle = "0.6.2"
regex = "1.13.1"
rmp-serde = "1.3.1"
rustc-hash = "2.1.3"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serial2 = "0.2.38"
shared_library = "0.1.9"
shell-words = "1.1.1"
smol = "2.0.2"
swash = "0.2.10"
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tar = "0.4.46"
# Direct dependency for the Windows OSC 99 untracked leg (Task 138.C15): the
# toast is built with its own image (`appLogoOverride`) instead of through
# `notify-rust`, which only offers an inline image. Same version `notify-rust`
# already resolves, so the lock file keeps a single copy.
tauri-winrt-notification = "0.8.1"
tempfile = "3.27.0"
test-log = { version = "0.2.21", features = ["trace"] }
thiserror = "2.0.21"
toml = "1.1.6"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "parking_lot"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
vergen = { version = "10.0.3", features = ["build", "cargo", "rustc", "si"] }
winapi = "0.3.9"
# default-features is off because winit's default `wayland-csd-adwaita` pulls
# sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser (unmaintained,
# RUSTSEC-2026-0192, #530). The list below is winit 0.30's default set with
# `wayland-csd-adwaita` swapped for `wayland-csd-adwaita-notitle`. Accepted
# tradeoff: client-side decorations on Wayland compositors without
# server-side decorations (e.g. GNOME) lose their title text; buttons and the
# drag area remain. winit 0.31's `wayland-csd-adwaita-skrifa` restores titles
# once egui-winit moves to winit 0.31. egui-winit must also keep `winit/default`
# off (see its entry above); re-enabling its defaults reintroduces ttf-parser.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-csd-adwaita-notitle", "wayland-dlopen", "x11"] }
winreg = "0.56.0"
# Direct dependency for the Linux/BSD OSC 99 notification service (Task 138.12):
# one D-Bus connection owns `Notify` / `CloseNotification` / `GetCapabilities`
# and observes `ActionInvoked` / `NotificationClosed`. zbus 6 has no blocking
# API, so the service's dispatcher and signal-pump threads drive the async API
# with `zbus::block_on`. `default-rt` is zbus's own runtime (zruntime), which
# `block_on` needs; `proxy` is the `Proxy` the `NO_AUTO_START` calls go
# through. Listed with `default-features = false` so the choice is explicit and
# a future default (for example `tokio`) cannot slip in.
zbus = { version = "6.0.0", default-features = false, features = ["default-rt", "proxy"] }

# Members opt in with `[lints] workspace = true`. `portable-pty` deliberately
# does NOT: it is vendored from wezterm and stays out of the workspace lint
# policy so it can track upstream without lint churn.
[workspace.lints.clippy]
# Lint groups. Priority -1 so the individual lints below can override them.
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
all = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }

# Panic-free production code. Test code is exempted via `clippy.toml`
# (`allow-unwrap-in-tests` / `allow-expect-in-tests`).
unwrap_used = "deny"
expect_used = "deny"

# Task 70.H tripwires: explicit deny for the three cast lints that guard
# against silent truncation/sign-loss/wrap in numeric conversions. These
# are already part of `clippy::pedantic` above, but naming them directly
# documents the contract and survives any future reorganization of the
# pedantic group. All remaining `as` casts must be covered by a local
# `#[allow(...)]` with a justification comment per agents.md.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

# The duplicate versions are all transitive and not fixable by pinning our
# direct dependencies (`cargo tree --workspace -d --target all -e normal,build`):
#   - the exact-pinned egui 0.36 / winit 0.30 windowing stack: objc2 0.5/0.6
#     and its siblings (block2, objc2-app-kit, objc2-foundation, objc2-ui-kit,
#     objc2-core-foundation), smithay-client-toolkit 0.19/0.20, calloop
#     0.13/0.14 and calloop-wayland-source, rustix 0.38/1 with linux-raw-sys,
#     windows-sys 0.52-0.61 with windows-targets and the windows_* target
#     crates, bitflags 1 (core-graphics), redox_syscall 0.4/0.5/0.9, jni-sys
#     0.3/0.4 (ndk), downcast-rs 1 (wayland-backend);
#   - thiserror 1 via conv2 and calloop;
#   - getrandom 0.3 and r-efi 5/6 via ahash (egui);
#   - miniz_oxide 0.8 via png / backtrace vs 0.9 via flate2;
#   - syn 3 via the zbus / bon proc-macros.
# Duplicate tracking lives in `deny.toml` (`[bans] multiple-versions = "warn"`);
# `cargo deny check` lists them. Revisit when the windowing stack moves.
multiple_crate_versions = "allow"

# Metadata is inherited from the workspace.
cargo_common_metadata = "allow"

# Profiling profile: optimized like release but with full debuginfo and
# without stripping, so `perf` / `cargo flamegraph` produce symbol-rich,
# inline-aware stacks. Build with `cargo build --profile profiling` (or
# `cargo flamegraph --profile profiling ...`). No effect on the normal
# `release` / `dev` builds. See `Documents/PROFILING.md` for the full
# methodology -- in particular the `--call-graph dwarf,65528` stack-size flag,
# without which `perf` silently truncates freminal's deep stacks and yields a
# false-negative flamegraph.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
