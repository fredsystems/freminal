[package]
name = "freminal-terminal-emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
documentation.workspace = true
readme.workspace = true
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.cargo-machete]
ignored = ["arc-swap"]

[[bench]]
harness = false
name = "buffer_benches"

[dependencies]
arc-swap.workspace = true
conv2.workspace = true
crossbeam-channel.workspace = true
flate2.workspace = true
freminal-buffer = { path = "../freminal-buffer" }
rmp-serde.workspace = true
serde.workspace = true
freminal-common = { path = "../freminal-common" }
image.workspace = true
portable-pty = { path = "../portable-pty" }
sys-locale.workspace = true
tar.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs", "hostname", "mman", "term", "user"] }

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["handleapi", "memoryapi", "winbase", "winnt"] }

# dev dependencies
[dev-dependencies]
anyhow.workspace = true
criterion.workspace = true
# `test-utils` exposes `terminfo_source` (the `res/freminal.ti` text and its
# parser) for the table-of-truth tests; production builds never enable it.
freminal-common = { path = "../freminal-common", features = ["test-utils"] }
proptest.workspace = true
test-log.workspace = true
# assert_cmd.workspace = true
# predicates.workspace = true

[build-dependencies]
vergen.workspace = true

[features]
default = []

[lints]
workspace = true
