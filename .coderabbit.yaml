# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for Freminal (GitHub issue 554): the most thorough,
# effective review we can get out of CodeRabbit.
#
# This repo's guidelines file is the lowercase `agents.md`. CodeRabbit only
# auto-discovers `**/AGENTS.md` (case-sensitive), and it only auto-discovers
# skills under `.agents/`, `.claude/`, `.codex/`, `.cursor/`, `.gemini/` and
# `.github/` -- not `.opencode/skills/`. So `agents.md`, the freminal-specific
# skills, and the shared skills (from the same-org `FredSystems/nixos` repo) are
# all fed in explicitly via `knowledge_base.code_guidelines.filePatterns`,
# each scoped with `applyTo` to the files it governs.

language: en-US
early_access: false
tone_instructions: >-
  Direct, technical, specific. Cite file:line, state the violated rule and the
  fix. No praise, no filler, no restating the diff. Prefer correctness findings
  over style nitpicks.

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  review_details: true
  collapse_walkthrough: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Freminal PRs routinely carry many commits; pausing after 5 defeats review.
    auto_pause_after_reviewed_commits: 0
    # Review stacked / integration-branch PRs, not just those targeting main.
    base_branches:
      - ".*"

  # Exclude only generated / binary / bulk-data noise. Source, lockfiles, the
  # vendored portable-pty crate and golden test snapshots stay in review.
  path_filters:
    # Recordings (FREC) and raw binary captures.
    - "!**/*.frec"
    - "!**/*.bin"
    # Fonts, terminfo tarball, and reference PDFs: binary, not reviewable.
    - "!res/**/*.ttf"
    - "!res/terminfo.tar"
    - "!Documents/reference/*.pdf"
    # Icons and logos (binary PNG/ICNS, machine-exported SVG).
    - "!assets/**/*.png"
    - "!assets/**/*.icns"
    - "!assets/**/*.svg"
    # Profiler output.
    - "!**/flamegraph*.svg"
    # Random text generated by speed_tests/random_crap.py.
    - "!speed_tests/*_lines.txt"

  path_instructions:
    - path: "**/*.rs"
      instructions: |
        Rust edition 2024. Enforce these rules (see agents.md and the Rust skills):
        - Panic-free production code: `unwrap()` / `expect()` are forbidden outside `#[cfg(test)]` and `tests/`. Also flag indexing, slicing and arithmetic that can panic or overflow when the index, length or operand comes from external input (PTY bytes, files, config).
        - No raw `as` casts between numeric types in production code. Use `conv2` (`ValueFrom` / `ValueInto` for checked, `ApproxFrom` / `ApproxInto` for lossy float conversions).
        - No `bool` fields or `bool` parameters where a named domain enum belongs (e.g. `BlinkState::Enabled`). Flag bare `true` / `false` at call sites and bool pairs that cannot both be true. Terminal modes must use the enums in `freminal-common/src/buffer_states/modes/`, never a raw `bool`.
        - No `#[allow(dead_code)]` in production modules (test-only helpers are acceptable).
        - Errors must be typed and structured. No `anyhow` / `color-eyre` in library crates (`freminal-common`, `freminal-buffer`, `freminal-terminal-emulator`); they are acceptable only in `xtask`. Error variants describe what went wrong, not what to do.
        - Every new public API needs tests; every bug fix needs a regression test.
        - Any `#[allow(clippy::...)]` needs an adjacent justification comment. Flag new `too_many_lines` / `too_many_arguments` / `excessive_bools` allows.
        - No `unsafe` without explicit, documented justification.
        - Respect crate dependency direction and do not weaken the lock-free GUI/PTY architecture.
    - path: "freminal-common/**"
      instructions: |
        Shared types and utilities only. No business logic. Every change here
        ripples to all downstream crates, so scrutinise public API changes,
        enum variant additions (exhaustive matches downstream), and serde /
        config schema compatibility. Config changes must wire up
        `ConfigPartial` / `apply_partial` and `config_example.toml`.
    - path: "freminal-buffer/**"
      instructions: |
        Pure data model. No escape-sequence parsing, no rendering, no UI, no
        OS APIs. Mutations must return a structured description of what
        changed (damage/dirty information) rather than a bare bool. Check
        wide-character, wrap, scrollback, and resize edge cases, plus
        off-by-one errors on row/column arithmetic.
    - path: "freminal-terminal-emulator/**"
      instructions: |
        ANSI parser and terminal state machine. No rendering, no egui, no GUI
        state.
        - Any change that adds, removes, or alters escape-sequence support (C0/C1, ESC, CSI, OSC, DCS, APC, DEC modes) MUST update BOTH `Documents/ESCAPE_SEQUENCE_COVERAGE.md` and `Documents/ESCAPE_SEQUENCE_GAPS.md`. Flag the PR if either is missing.
        - PTY output is untrusted input. Flag unbounded allocation or buffering driven by attacker-controlled lengths or counts, unchecked arithmetic on parsed parameters, unbounded recursion or loops, and missing limits on payload sizes (OSC / DCS / APC / graphics).
        - Flag reverse-path (reply) injection: replies written back to the PTY (DA, DSR, XTGETTCAP, OSC queries, kitty protocol responses) must never echo unsanitised attacker-controlled bytes, and must not let a program forge input events.
        - Do not guess terminal semantics; require a spec reference (ECMA-48, xterm ctlseqs, kitty docs) for new behaviour.
    - path: "freminal/**"
      instructions: |
        GUI binary.
        - `update()` is a pure read of the `Arc<TerminalSnapshot>` published via `ArcSwap`. It must not mutate emulator state.
        - All input to the emulator flows through the `crossbeam` `Sender<InputEvent>` channel.
        - `ViewState` (scroll, mouse, focus) is owned by the GUI and never shared.
        - Do not reintroduce `FairMutex` or any lock/shared mutable state across the GUI/PTY split. Flag new `Mutex` / `RwLock` / `Arc<Mutex<_>>` crossing that boundary.
        - Every keyboard shortcut goes through `BindingMap` (KeyAction variant, default binding, dispatch, `config_example.toml` docs). Hardcoded shortcuts are forbidden.
        - Modals and overlays with a text field must register in `ui_overlay_open` and use `lock_focus(true)` or they cannot be typed in.
        - Damage derivation must be classified before using `Full` repaint; see the damage-model skill.
        - Mouse-cursor changes go through the single-writer rule in the cursor-affordances skill.
    - path: "freminal-windowing/**"
      instructions: |
        Windowing and egui integration (winit + glutin + egui). `egui`,
        `egui_glow` and `egui-winit` are exact-pinned (`=`) as a matched set
        because chrome caching relies on undocumented egui internals (see
        `Documents/EGUI_UPGRADE_ASSUMPTIONS.md`); `glow` is deliberately held
        at the version `egui_glow` declares (see the comment in the root
        `Cargo.toml`). Flag loosening those pins, or reliance on new egui
        internals, without updating that checklist. Check platform-specific code for correctness on
        Linux, macOS and Windows.
    - path: "**/Cargo.toml"
      instructions: |
        Crate dependency direction is one-way: `freminal` ->
        `freminal-terminal-emulator` -> `freminal-buffer` -> `freminal-common`
        (`xtask` is separate build tooling). Flag any reverse or cyclic
        dependency. Dependencies must be fully pinned to a semver version and
        listed in alphabetical order. Flag new dependencies without clear
        justification, `anyhow` in library crates, and loosened exact pins for
        the egui stack.
    - path: "portable-pty/**"
      instructions: |
        Vendored from wezterm and shipped in the binary. Review for correctness
        and security only: memory safety, handle/fd leaks, privilege or
        injection issues, Windows/Unix behaviour, and panics reachable at
        runtime (a panic here takes down the terminal). Do NOT comment on
        style, naming or lint allows: the crate is deliberately outside the
        workspace lint set.
    - path: ".github/workflows/**"
      instructions: |
        - Third-party actions must be pinned by full commit SHA (with a version comment), not a tag or branch.
        - Use least-privilege `permissions:` at workflow and job level.
        - No script injection: never interpolate untrusted `${{ github.event.* }}` values (PR title/body/branch names, comments) directly into `run:` steps. Pass them through `env:`.
        - Flag `pull_request_target` with checkout of PR code, and secrets exposed to untrusted code.
        - Every CI change must keep the Windows, macOS and Linux matrix intact.
    - path: "**/*.nix"
      instructions: |
        Must pass `nixfmt`, `statix check`, and `deadnix --fail` (no unused
        bindings or empty `{ ... }:` patterns, no `with` abuse). Any system
        tool the build or tests need belongs in a `flake.nix` dev shell, not
        installed out-of-band or worked around in application logic.
    - path: "Documents/**"
      instructions: |
        - `MASTER_PLAN.md`: the Task Summary Status column and the Completion Tracking table must agree. A task merged via PR must be `Complete` in both with a completion date. Status moves only forward: Stub/Planned -> In progress -> Pending merge -> Complete.
        - No summary or progress documents (no `PHASE_X_SUMMARY.md`, `IMPLEMENTATION_PROGRESS.md`, "what I did" notes). Documentation must be durable reference material.
        - Escape-sequence docs: `ESCAPE_SEQUENCE_COVERAGE.md` and `ESCAPE_SEQUENCE_GAPS.md` must be updated together with the "Last updated" header.
        - Markdown must pass markdownlint (fenced code blocks with a language tag, blank lines around fences, aligned table columns).
    - path: "**/tests/**"
      instructions: |
        Tests must be hermetic and order-independent, and assert observable
        behaviour rather than re-implementing production logic. A flaky test is
        a bug: flag retries, `#[ignore]`, `sleep`-based synchronisation, longer
        timeouts, and loosened tolerances as red flags and require the root
        cause. Golden files must be regenerated deliberately, never edited by
        hand to make a test pass.
    - path: "**/benches/**"
      instructions: |
        Benchmark IDs must stay stable so before/after comparisons remain
        valid; flag renamed or removed benchmark IDs. A change to
        render / PTY / buffer / parser / `build_snapshot` code should come with
        before/after numbers, and a regression above 15% needs justification.
        Benchmarks must be deterministic and must not depend on the network or
        wall-clock state.

  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    ruff:
      enabled: true
    osvScanner:
      enabled: true
    github-checks:
      enabled: true

  pre_merge_checks:
    title:
      mode: warning
      requirements: >-
        Conventional Commits format (feat:, fix:, refactor:, docs:, test:,
        chore:, style:, perf:, ci:), concise, imperative.
    description:
      mode: warning
    issue_assessment:
      mode: warning
    docstrings:
      mode: warning

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      # --- Always-on project guidelines -------------------------------------
      - files: "agents.md"
        applyTo: "**"

      # --- Freminal skills: all Rust code -----------------------------------
      - files: ".opencode/skills/freminal-architecture/SKILL.md"
        applyTo: "**/*.rs"
      - files: ".opencode/skills/freminal-extend-or-extract/SKILL.md"
        applyTo: "**/*.rs"
      - files: ".opencode/skills/freminal-module-cohesion/SKILL.md"
        applyTo: "**/*.rs"
      - files: ".opencode/skills/freminal-state-representation/SKILL.md"
        applyTo: "**/*.rs"
      - files: ".opencode/skills/freminal-numeric-conversions/SKILL.md"
        applyTo: "**/*.rs"
      - files: ".opencode/skills/freminal-bench-table/SKILL.md"
        applyTo: "**/*.rs"
      - files: ".opencode/skills/freminal-windows-crosscheck/SKILL.md"
        applyTo: "**/*.rs"

      # --- Freminal skills: GUI and windowing -------------------------------
      - files: ".opencode/skills/freminal-damage-model/SKILL.md"
        applyTo: "freminal/**/*.rs,freminal-windowing/**/*.rs"
      - files: ".opencode/skills/freminal-cursor-affordances/SKILL.md"
        applyTo: "freminal/**/*.rs,freminal-windowing/**/*.rs"
      - files: ".opencode/skills/freminal-modal-input-suppression/SKILL.md"
        applyTo: "freminal/**/*.rs,freminal-windowing/**/*.rs"
      - files: ".opencode/skills/freminal-pending-visual-preview/SKILL.md"
        applyTo: "freminal/**/*.rs,freminal-windowing/**/*.rs"
      - files: ".opencode/skills/freminal-toast-options/SKILL.md"
        applyTo: "freminal/**/*.rs,freminal-windowing/**/*.rs"

      # --- Freminal skills: topic-specific ----------------------------------
      - files: ".opencode/skills/freminal-config-options/SKILL.md"
        applyTo: "**/*.rs,config_example.toml"
      - files: ".opencode/skills/freminal-escape-sequence-docs/SKILL.md"
        applyTo: "freminal-terminal-emulator/**/*.rs,Documents/ESCAPE_SEQUENCE_*.md"
      - files: ".opencode/skills/freminal-egui-upgrade/SKILL.md"
        applyTo: "Cargo.toml,Cargo.lock,renovate.json"
      - files: ".opencode/skills/freminal-plan-status-lifecycle/SKILL.md"
        applyTo: "Documents/**"
      - files: ".opencode/skills/freminal-version-activation/SKILL.md"
        applyTo: "Documents/**"
      - files: ".opencode/skills/freminal-frec-decoder/SKILL.md"
        applyTo: "sequence_decoder.py,freminal-terminal-emulator/src/recording.rs"

      # --- Shared skills from the same-org FredSystems/nixos repo -----------
      - files: "nixos:.opencode/skills/languages/rust-best-practices/SKILL.md"
        applyTo: "**/*.rs"
      - files: "nixos:.opencode/skills/shared/state-representation/SKILL.md"
        applyTo: "**/*.rs"
      - files: "nixos:.opencode/skills/shared/module-cohesion/SKILL.md"
        applyTo: "**/*.rs"
      - files: "nixos:.opencode/skills/shared/testing-mandate/SKILL.md"
        applyTo: "**/*.rs"
      - files: "nixos:.opencode/skills/shared/performance-benchmarks/SKILL.md"
        applyTo: "**/*.rs"
      - files: "nixos:.opencode/skills/shared/flaky-tests-are-bugs/SKILL.md"
        applyTo: "**/tests/**,**/*.rs"
      - files: "nixos:.opencode/skills/shared/markdown-lint-discipline/SKILL.md"
        applyTo: "**/*.md"
      - files: "nixos:.opencode/skills/shared/no-summary-documents/SKILL.md"
        applyTo: "**/*.md"
      - files: "nixos:.opencode/skills/shared/shebang-env-discipline/SKILL.md"
        applyTo: "**/*.sh,**/*.py"
      - files: "nixos:.opencode/skills/languages/nix-best-practices/SKILL.md"
        applyTo: "**/*.nix"
      - files: "nixos:.opencode/skills/shared/flake-dev-shell-discipline/SKILL.md"
        applyTo: "**/*.nix"
      - files: "nixos:.opencode/skills/shared/commit-discipline/SKILL.md"
        applyTo: "**"

chat:
  auto_reply: true
