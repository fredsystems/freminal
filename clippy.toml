# Production code stays denied (`clippy::unwrap_used` / `clippy::expect_used`
# in the workspace lints). This only exempts `#[test]` functions and
# `#[cfg(test)]` code, matching the repo rule "unwrap/expect forbidden
# outside #[cfg(test)] / tests/".
allow-unwrap-in-tests = true
allow-expect-in-tests = true
