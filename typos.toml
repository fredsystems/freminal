[files]
extend-exclude = [
  ".git/",  # Version control files
  "res/",  # Resource files
  "freminal/Cargo.lock",
  "speed_tests/*",
  ".dictionary.txt"
]
ignore-hidden = false

# Corrections take the form of a key/value pair. The key is the incorrect word
# and the value is the correct word. If the key and value are the same, the
# word is treated as always correct. If the value is an empty string, the word
# is treated as always incorrect.

# Match Whole Word - Case Sensitive
# [default.extend-identifiers]
# iy = "iy"       # Variable name used in bevy_gizmos. Probably stands for "y-axis index", as it's being used in loops.
# ser = "ser"     # ron::ser - Serializer
# SME = "SME"     # Subject Matter Expert
# Sur = "Sur"     # macOS Big Sur - South
# Masia = "Masia" # The surname of one of the authors of SMAA
# Ba = "Ba"       # Bitangent for Anisotropy
# ba = "ba"       # Part of an accessor in WGSL - color.ba

# Match Inside a Word - Case Insensitive
# [default.extend-words]
# LOD = "LOD" # Level of detail
# TOI = "TOI" # Time of impact

[default]
locale = "en"
extend-ignore-identifiers-re = [  # NDK - Native  Development Kit
  "Pn",
  "ratatui",
  "BA",
  "Ot",
  "Sur",
  "Sceptre",
  "DECID",
  "iterm",
  "Hel",
  "behaviour",
  "kend",
  "kHOM",
  "kEND",
  "smkx",
  "rmkx",
  "mis",
  "PNG"
]
# Abbreviated git commit hashes (e.g. `c3daa1be`) cited in plan documents.
extend-ignore-re = [
  "\\b[0-9a-f]{7,40}\\b"
]

[default.extend-words]
flate = "flate"             # DEFLATE / the `flate2` crate
iy = "iy"                   # y-axis loop index (paired with `ix`)
scrolll = "scrolll"         # Linux evdev `LED_SCROLLL` (sic, doubled L)
hthe = "hthe"               # `\x1b[H` (CUP) immediately followed by "the" in test input
anothers = "anothers"       # possessive inside a snake_case test name
unparseable = "unparseable" # accepted variant spelling of "unparsable"
