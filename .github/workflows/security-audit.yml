name: Security Audit

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  audit:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Same toolchain as ci.yml's `deny` job: cargo-deny runs `cargo metadata`.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"

      - name: Install cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny

      - name: Check advisories
        id: audit
        run: |
          set +e
          cargo deny --locked check advisories > "${RUNNER_TEMP}/audit.txt" 2>&1
          status=$?
          set -e
          cat "${RUNNER_TEMP}/audit.txt"
          if [ "${status}" -eq 0 ]; then
            echo "failed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "failed=true" >> "${GITHUB_OUTPUT}"
          fi
          exit 0

      - name: Sync tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AUDIT_FAILED: ${{ steps.audit.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: "Security audit: cargo-deny advisories failing on main"
        run: |
          set -euo pipefail

          number="$(
            gh issue list --state open \
              --search "in:title \"${ISSUE_TITLE}\"" \
              --json number,title \
              | jq -r --arg title "${ISSUE_TITLE}" \
                '[.[] | select(.title == $title)] | first | .number // empty'
          )"

          if [ "${AUDIT_FAILED}" = "true" ]; then
            output="$(head -c 60000 "${RUNNER_TEMP}/audit.txt")"
            {
              echo "\`cargo deny --locked check advisories\` failed on \`main\`."
              echo
              echo "Run: ${RUN_URL}"
              echo
              echo '```text'
              echo "${output}"
              echo '```'
            } > "${RUNNER_TEMP}/body.md"

            if [ -z "${number}" ]; then
              gh issue create \
                --title "${ISSUE_TITLE}" \
                --body-file "${RUNNER_TEMP}/body.md"
            else
              gh issue comment "${number}" --body-file "${RUNNER_TEMP}/body.md"
            fi
          elif [ -n "${number}" ]; then
            gh issue comment "${number}" --body "Resolved as of run ${RUN_URL}"
            gh issue close "${number}"
          fi

      - name: Fail if audit failed
        env:
          AUDIT_FAILED: ${{ steps.audit.outputs.failed }}
        run: |
          if [ "${AUDIT_FAILED}" = "true" ]; then
            echo "cargo-deny advisories check failed"
            exit 1
          fi
