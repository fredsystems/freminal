name: Benchmark Regression Check

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC
  workflow_dispatch: {} # Manual trigger

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download previous benchmark results
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/criterion
          key: bench-criterion-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            bench-criterion-${{ runner.os }}-

      - name: Run benchmarks
        run: >
          cargo bench
          --bench render_loop_bench
          --bench buffer_row_bench
          --bench buffer_benches
          -- --save-baseline current

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion
          retention-days: 90

      # Note: Criterion stores comparison data in target/criterion when a
      # previous baseline exists. The cache step above restores it so each
      # run can compare against the prior week. Regressions are visible in
      # the Criterion HTML reports (uploaded as artifacts) and in the raw
      # terminal output above.
      #
      # The 20% regression threshold is enforced by human review of the
      # Criterion output, not by an automated gate. CI runner noise makes
      # automated gating unreliable. If a future Criterion-based comparison
      # tool is adopted, it can be added here.
