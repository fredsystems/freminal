name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # =====================================================================
  # Fast-path: skip redundant merge-queue re-checks when the synthetic
  # commit is directly against main (no other PRs queued ahead).
  # =====================================================================
  skip-if-clean:
    name: Skip if merge_queue produces no diff
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    if: ${{ always() }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Merge Queue CI Check Skipper
        id: merge-queue-ci-skipper
        uses: ./.github/merge-queue-ci-skipper
        with:
          secret: ${{ secrets.GH_ACCESS_TOKEN }}

      - name: Check merge_group synthetic commit
        id: check
        run: |
          # PR mode: never skip
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ steps.merge-queue-ci-skipper.outputs.skip-check }}" = "true" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  build-and-check:
    runs-on: ubuntu-latest
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # --- Install Nix via Determinate Systems ---
      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: false

      # --- Enter your flake's devShell (same behavior as direnv) ---
      - name: Run checks in devShell
        run: |
          nix develop --impure --command bash -e -c '
            set -euxo pipefail
            pre-commit run --all-files
          '

  # Run cargo coverage. This will generate a coverage report and upload it to codecov.
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
      # --- Install Nix ---
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # `xtask coverage` runs `cargo llvm-cov nextest`.
          tool: cargo-llvm-cov,cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Run clippy with `-D warnings` on every target OS on stable, and verify the
  # workspace compiles on the MSRV.
  #
  # Stable: `cargo xtask check` runs clippy (a superset of `cargo check`) with
  # warnings denied, so this matrix is a genuine cross-platform
  # fail-on-warning gate — it catches OS-specific warnings (e.g. `dead_code`
  # for a function whose only non-test caller is behind `#[cfg(...)]` on
  # another platform) that would otherwise only surface downstream.
  #
  # MSRV: `cargo xtask check-msrv` runs plain `cargo check` (no clippy, warnings
  # not denied). The MSRV contract is "it builds on `rust-version`"; linting
  # with the MSRV clippy as well forced code to satisfy two drifting lint sets
  # at once, and since no local gate runs that clippy, its failures only ever
  # appeared here (issue #540). Keep the MSRV entry in sync with
  # `rust-version` in the workspace `Cargo.toml`.
  check:
    name: Check ${{ matrix.os }} ${{ matrix.toolchain }}
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-26.04-arm]
        # Stable + MSRV only. Nightly is deliberately excluded: `xtask check`
        # runs clippy with `-D warnings`, and nightly clippy churns new lints
        # that frequently suggest unstable APIs (e.g. `chunks_exact_to_as_chunks`
        # -> `as_chunks_mut`, which does not exist on stable/MSRV). Gating CI on
        # nightly clippy would make the build fail on lint drift we cannot act
        # on without breaking the MSRV.
        toolchain: ["stable", "1.96.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ matrix.toolchain }}
          # `cargo xtask check` runs clippy on stable. dtolnay/rust-toolchain
          # omits clippy for pinned-version toolchains (only the named
          # @stable / @nightly entry points bundle it), so request it
          # explicitly; harmless on the MSRV leg, which does not use it.
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - if: ${{ matrix.toolchain == 'stable' }}
        run: cargo xtask check
      - if: ${{ matrix.toolchain != 'stable' }}
        run: cargo xtask check-msrv

  # Run the test suite natively on every target platform. The `check`
  # matrix above only compiles (`cargo xtask check`); it never runs the
  # tests, and `build-and-check` runs them on Linux only. Platform-specific
  # test failures — e.g. macOS's 31-char POSIX shm-name limit surfacing as
  # `ENAMETOOLONG` where Linux allows 255 — are invisible without this job.
  #
  # Windows cannot be tested under Nix, so this native matrix is the sole
  # cross-platform test gate for Windows and macOS. A single toolchain is
  # used deliberately: test behavior differs by *platform*, not by compiler
  # version, and the multi-toolchain sweep is already covered by `check`.
  test:
    name: Test ${{ matrix.os }}
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-26.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      # `xtask test` runs the suite under cargo-nextest (issue #538).
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask test

  # Dependency audit. Blocks PRs on new RustSec advisories and on cargo-deny
  # bans, licence, or source violations. The daily `security-audit.yml`
  # workflow catches advisories published between PRs.
  deny:
    name: Dependency audit (cargo-deny)
    runs-on: ubuntu-latest
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo deny --locked check

  # Deterministic fuzz gate (issue 553). `cargo xtask fuzz-replay` first runs
  # `cargo fmt --check`, `cargo clippy --all-targets -- -D warnings` and
  # `cargo test --lib` in the standalone `fuzz/` crate (it is excluded from the
  # root workspace, so none of the jobs above see it), then replays every
  # committed seed and regression input through every fuzz target, each file
  # as an individual input (`-runs=1`). No fuzzing happens here: a replay is
  # deterministic, so a failure is a real regression and this job is required.
  # The time-boxed fuzzing lives in `fuzz-smoke` (advisory) and
  # `fuzz-nightly.yml`.
  #
  # Everything runs inside `nix develop .#fuzz` (pinned nightly + cargo-fuzz).
  # `xtask` builds in the root `target/`, the fuzz crate in `fuzz/target/`, so
  # both are cached.
  fuzz-replay:
    name: Fuzz replay (seeds + regressions)
    runs-on: ubuntu-latest
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Install Nix via Determinate Systems ---
      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: false

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            fuzz -> target
            . -> target

      # `--sandbox none`: the xtask default wraps fuzz binaries in bubblewrap,
      # which cannot create user namespaces on the hosted runner. The runner
      # is a disposable VM, so the sandbox adds nothing here.
      - name: Lint, test and replay the fuzz crate
        run: |
          nix develop .#fuzz --command bash -e -c '
            set -euxo pipefail
            cargo xtask fuzz-replay --sandbox none
          '

  # Time-boxed fuzzing of every target. ADVISORY: deliberately not listed in
  # `ci-success.needs`, and `continue-on-error` keeps a red result from showing
  # as a failed check. Short fuzzing runs are nondeterministic (the same
  # commit can pass or fail), and known open crashes exist in some targets
  # (tracked in issues #556, #557, #558 and #559, and in a private security
  # advisory), so a blocking gate would be both flaky and permanently red.
  # Findings surface through the step summary and the uploaded artifacts,
  # never by blocking a PR. The deterministic gate is `fuzz-replay`.
  fuzz-smoke:
    name: Fuzz smoke (advisory)
    runs-on: ubuntu-latest
    needs: skip-if-clean
    if: ${{ needs.skip-if-clean.outputs.skip != 'true' }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- Install Nix via Determinate Systems ---
      - name: Set up Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@d0c908e6cbe9f89f36ed8205a3ab6f092636916a # v3

      - name: Use Determinate Cache
        uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          use-gha-cache: false

      - name: Cache cargo build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            fuzz -> target
            . -> target

      # `--sandbox none`: bubblewrap cannot create user namespaces on the
      # hosted runner, which is a disposable VM anyway. The corpus and
      # artifact roots are passed through `env:` (not interpolated into the
      # script) and read by xtask from FREMINAL_FUZZ_CORPUS_DIR /
      # FREMINAL_FUZZ_ARTIFACTS_DIR.
      - name: Fuzz every target (30s each)
        env:
          FREMINAL_FUZZ_CORPUS_DIR: ${{ runner.temp }}/fuzz-corpus
          FREMINAL_FUZZ_ARTIFACTS_DIR: ${{ runner.temp }}/fuzz-artifacts
        run: |
          nix develop .#fuzz --command bash -e -c '
            set -euxo pipefail
            cargo xtask fuzz-smoke --time 30 --sandbox none 2>&1 \
              | tee "${RUNNER_TEMP}/fuzz-smoke.log"
          '

      # Append the result table (from the `fuzz-smoke summary` line onward).
      - name: Publish summary
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/fuzz-smoke.log" ]; then
            {
              echo '### Fuzz smoke (advisory)'
              echo
              echo '```text'
              sed -n '/^fuzz-smoke summary/,$p' "${RUNNER_TEMP}/fuzz-smoke.log"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-smoke-artifacts
          path: ${{ runner.temp }}/fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - skip-if-clean
      - build-and-check
      - coverage
      - check
      - test
      - deny
      - fuzz-replay
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "skip-if-clean:   ${{ needs.skip-if-clean.outputs.skip }}"
          echo "build-and-check: ${{ needs.build-and-check.result }}"
          echo "coverage:        ${{ needs.coverage.result }}"
          echo "check:           ${{ needs.check.result }}"
          echo "test:            ${{ needs.test.result }}"
          echo "deny:            ${{ needs.deny.result }}"
          echo "fuzz-replay:     ${{ needs.fuzz-replay.result }}"

          # Fast-path: if the merge queue skipper determined no re-check
          # is needed, all downstream jobs were skipped — that is success.
          if [[ "${{ needs.skip-if-clean.outputs.skip }}" == "true" ]]; then
            echo "✅ Merge queue fast-path: checks skipped (already validated on PR)"
            exit 0
          fi

          if [[ "${{ needs.build-and-check.result }}" != "success" ]]; then
            echo "❌ build-and-check failed"
            exit 1
          fi

          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "❌ coverage failed"
            exit 1
          fi

          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "❌ check matrix failed"
            exit 1
          fi

          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ test matrix failed"
            exit 1
          fi

          if [[ "${{ needs.deny.result }}" != "success" ]]; then
            echo "❌ deny failed"
            exit 1
          fi

          if [[ "${{ needs.fuzz-replay.result }}" != "success" ]]; then
            echo "❌ fuzz-replay failed"
            exit 1
          fi

          echo "✅ All CI jobs succeeded"
