# configuration for https://github.com/EmbarkStudios/cargo-deny

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
version = 2
confidence-threshold = 0.8

[advisories]
version = 2
# Every ignore must reference a tracking issue and be removed once the
# underlying advisory is resolved. Any advisory not listed here fails CI.
ignore = []

[bans]
# Duplicate crate versions are tracked here; clippy's lint is allowed in Cargo.toml.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
