# ghostty.conf — Task 125.2 hermetic parity fixture (template).
#
# Rendered by workloads.sh's `render_fixture` into an isolated per-run
# directory before every capture, and loaded via
# `ghostty --config-default-files=false --config-file=<rendered-copy>`.
# Never edited in place and never the operator's real
# `~/.config/ghostty/config.ghostty`. Every key below was verified against
# the installed Ghostty 1.3.1's own
# `ghostty +show-config --default --docs` output; see
# Documents/PROFILING.md, "Task 125 parity fixtures" for the verification
# trail. Tokens (`@..@`) are substituted at render time.

# Geometry request: 124x31 cells. `window-decoration = false` is required for this
# to be exact -- Ghostty's own docs note a GTK bug where decorated windows
# do not translate window-width/window-height to the requested grid size
# 1:1.
window-width = 124
window-height = 31
window-decoration = false

# Font: same family/size/line-height as the other two terminals. Ligatures
# are on by default (font-feature is unset, i.e. no `-calt`/`-liga`/`-dlig`
# suppression), matching Freminal's `font.ligatures = true` and WezTerm's
# explicit `harfbuzz_features`.
font-family = CaskaydiaCove Nerd Font
font-size = 12
adjust-cell-height = 5%

# Cursor: block shape, no trail-equivalent animation exists in Ghostty to
# disable. Blink is the one axis the workload matrix varies;
# @CURSOR_STYLE_BLINK@ is substituted with "true" or "false" per rendered
# copy.
cursor-style = block
cursor-style-blink = @CURSOR_STYLE_BLINK@

# Opaque background, no background image, no custom shader.
background-opacity = 1
scrollback-limit = 20000000

# Run the same clean interactive shell fixture as the other two terminals.
# `direct:` skips the `/bin/sh -c` shell-expansion roundtrip since the
# argv is already fully resolved by the driver.
command = direct:/run/current-system/sw/bin/bash --noprofile --rcfile @SHELL_RC@ -i

# Determinism / isolation: a dedicated process per invocation (never
# attaches to an already-running Ghostty instance, which would measure the
# wrong PID tree), and no auto-injected shell integration competing with
# the explicit `--rcfile` fixture above.
gtk-single-instance = false
shell-integration = none

# No close-confirmation dialog blocking automated teardown.
confirm-close-surface = false

# Measurement-only topology controls shared by all three fixtures.
keybind = f6=new_tab
keybind = f7=new_split:right
keybind = f8=new_split:down
keybind = f9=goto_split:left
